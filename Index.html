<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Contact details</h1>
    <h2>Plz Enter Your Personal Details</h2>
    <label for="username">First Name</label>
    <input type="text" id="username" name="username" placeholder="First name" autofocus>

    <div>
    <label for="username">Last Name</label>
    <input type="text" id="username" name="username" placeholder="Last Name">
    </div>

    <div> 
  <label for="street-address">Street Address</label> 
  <input type="text" id="street-address" name="street-address" placeholder="Street Address" autocomplete="street-address"> 
</div>

<div> 
  <label for="city">Town / City</label> 
  <input type="text" id="city" name="city" placeholder="Town or City" autocomplete="address-level2"> 
</div>

<div> 
  <label for="postal-code">ZIP / Postal Code</label> 
  <input type="text" id="postal-code" name="postal-code" placeholder="e.g. 75300" autocomplete="postal-code"> 
</div>

<div>
  <label for="landline">Telephone</label>
  <input type="tel" id="landline" name="landline" placeholder="e.g. +1 555-0199" autocomplete="home tel">
</div>

<div>
  <label for="mobile">Mobile Number</label>
  <input type="tel" id="mobile" name="mobile" placeholder="e.g. +1 555-0100" autocomplete="mobile tel">
</div>

<div>
  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email">
</div>





</body>
</html>
